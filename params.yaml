content_based:
  max_features: 20000
  ngram_range: [1, 2]
  min_df: 2

user_based:
  min_ratings: 0
  chunk_size: 5000

hybrid:
  k_neighbors: 50
  top_n: 10
  neighbor_rating_threshold: 7.0
  min_num_ratings: 50

evaluation:
  top_k: 10
  random_state: 42
  content:
    sample_anime: 500
  user_based:
    sample_users: 200
    k_neighbors: 10
  hybrid:
    holdout_ratio: 0.2
    relevant_threshold: 7.0
    n_users_sample: 200
    min_user_ratings: 20

chatbot:
  model: "gemini-2.5-flash"
  

  
  fuzzy_search:
    top_n: 5
    min_score: 60
    ambiguous_delta: 5
  
  similarity_search:
    k: 10
  
  web_search:
    max_results: 5
    search_depth: "basic"
    include_domains:
      - "myanimelist.net"
      - "anilist.co"
      - "anime-planet.com"
      - "animenewsnetwork.com"
      - "crunchyroll.com"
      - "fandom.com"
  
  memory:
    max_tokens: 8000